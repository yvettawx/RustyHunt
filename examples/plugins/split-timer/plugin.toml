id = "split-timer"
name = "分段计时"
description = "部位破坏、讨伐、捕获和区域切换时自动分段，和这个任务的最好成绩比较。"
version = "1.0.0"
author = "RustyHunt"
app = "1.0"
api = "1.0"
permissions = ["files"]
events = ["quest_start", "quest_end", "part_break", "monster_death", "monster_capture", "stage_change"]
frame_hz = 4

[[modules]]
id = "split"
name = "分段计时"
template = "split.xml"
default_on = true
elements = [{ key = "diff", name = "和最好成绩的差" }]

[[actions]]
id = "split"
name = "分段计时 手动分段"
key = "F9"

[[actions]]
id = "reset"
name = "分段计时 清除最好成绩"
key = ""

[[settings]]
key = "stage_split"
name = "区域切换时分段"
type = "bool"
default = false

[[settings]]
key = "rows"
name = "显示段数"
type = "number"
default = 5
min = 1
max = 10

[[exporters]]
id = "markdown"
name = "Markdown 表格"
ext = "md"

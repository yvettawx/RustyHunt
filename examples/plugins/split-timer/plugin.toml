id = "split-timer"
name = "Split timer"
description = "Splits automatically on part breaks, slays, captures and area changes, and compares with your best run of the quest."
version = "1.0.0"
author = "RustyHunt"
app = "1.0"
api = "1.0"
permissions = ["files"]
events = ["quest_start", "quest_end", "part_break", "monster_death", "monster_capture", "stage_change"]
frame_hz = 4

[[modules]]
id = "split"
name = "Split timer"
template = "split.xml"
default_on = true
elements = [{ key = "diff", name = "Difference from best" }]

[[actions]]
id = "split"
name = "Split timer: manual split"
key = "F9"

[[actions]]
id = "reset"
name = "Split timer: clear best"
key = ""

[[settings]]
key = "stage_split"
name = "Split on area change"
type = "bool"
default = false

[[settings]]
key = "rows"
name = "Splits shown"
type = "number"
default = 5
min = 1
max = 10

[[exporters]]
id = "markdown"
name = "Markdown table"
ext = "md"

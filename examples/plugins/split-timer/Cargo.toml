[package]
name = "split-timer"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# 不属于主工作区，单独编译：cargo build --release --target wasm32-unknown-unknown
[workspace]

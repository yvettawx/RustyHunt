# 推 v1.2.3 这样的标签时打包，建一个草稿版本；检查无误后在网页上点发布。

name: 发布

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 核对版本号
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "标签 $env:GITHUB_REF_NAME 和 Cargo.toml 的版本 $v 不一致" }
      - name: 测试
        run: cargo test --workspace --locked
      - name: 打包
        shell: pwsh
        run: ./scripts/package.ps1
      - name: 建草稿版本
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "RustyHunt $v" --generate-notes `
            "dist/RustyHunt-$v-portable.zip" "dist/RustyHunt-$v-setup.exe" dist/SHA256SUMS

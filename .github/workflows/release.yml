# On a tag like v1.2.3, package the app and create a draft release; publish it on the web page after checking.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $v in Cargo.toml" }
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "RustyHunt $v" --generate-notes `
            "dist/RustyHunt-$v-portable.zip" "dist/RustyHunt-$v-setup.exe" dist/SHA256SUMS

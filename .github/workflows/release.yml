# On a tag like v1.2.3, package the app and publish it as the latest release.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $v in Cargo.toml" }
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          # Notes: this version's section of each changelog, Chinese first
          $notes = foreach ($f in 'CHANGELOG.zh-CN.md', 'CHANGELOG.md') {
            $section = (Get-Content $f -Raw -Encoding utf8) -split '(?m)^## ' | Where-Object { $_ -match "^$([regex]::Escape($v))\s" }
            if (-not $section) { throw "$f has no section for $v" }
            ($section -split "`n", 2)[1].Trim()
          }
          Set-Content notes.md ($notes -join "`n`n---`n`n") -Encoding utf8
          gh release create $env:GITHUB_REF_NAME --latest --verify-tag --title "RustyHunt $v" --notes-file notes.md `
            "dist/RustyHunt-$v-portable.zip" "dist/RustyHunt-$v-setup.exe" dist/SHA256SUMS

# On a tag like maps-20261101, publish the address maps in maps on their own.
# The app downloads maps it doesn't have at startup, without an app upgrade.

name: Address maps

on:
  push:
    tags: ['maps-*']

permissions:
  contents: write

jobs:
  maps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $maps = Get-ChildItem maps/*.map | Sort-Object Name
          $maps | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii SHA256SUMS
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --latest=false --title "Address maps $($env:GITHUB_REF_NAME.Substring(5))" `
            --notes "Game versions: $(($maps | ForEach-Object { $_.BaseName.Split('.')[1] }) -join ', ')" `
            @($maps.FullName) SHA256SUMS

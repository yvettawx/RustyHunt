# 推 maps-20261101 这样的标签时，把 maps 目录里的地址表单独发布。
# 程序启动时会下载本地没有的地址表，不用升级程序。

name: 地址表

on:
  push:
    tags: ['maps-*']

permissions:
  contents: write

jobs:
  maps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 建草稿版本
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $maps = Get-ChildItem maps/*.map | Sort-Object Name
          $maps | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii SHA256SUMS
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --latest=false --title "地址表 $($env:GITHUB_REF_NAME.Substring(5))" `
            --notes "游戏版本：$(($maps | ForEach-Object { $_.BaseName.Split('.')[1] }) -join '、')" `
            @($maps.FullName) SHA256SUMS

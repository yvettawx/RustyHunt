# Monster data for the Hunter's Notes (World: Iceborne).
# species: monster type, a key into [type] of locales/game/*.toml, following the in-game Hunter's Notes categories.
# maps: maps where it appears in expeditions (from the "Expedition" column of each Kiranico monster page, taken 2026-10-26).
#       A Ancient Forest, W Wildspire Waste, C Coral Highlands, R Rotten Vale, E Elder's Recess, H Hoarfrost Reach, G Guiding Lands.
# fixed: fixed size, no crowns to record.
# order: position in the in-game research level list (Ecological Research > Research levels), checked in game
#        2026-10-27 for every monster the list showed; the rest follow the Hunter's Notes order on
#        monsterhunterwiki.org, each placed after the nearest monster before it in that order.
# research: research level cap. 9 for monsters introduced in Low Rank, 7 for High Rank, 4 for new in Iceborne.
#           High Rank monsters that have no Master Rank research stay at 4: Zorah Magdaros, Xeno'jiiva, Bazelgeuse,
#           Nergigante, Vaal Hazak, Deviljho, Behemoth, Leshen and Ancient Leshen (their Master Rank versions are the
#           variants; none appears in the Guiding Lands). Sources: a community list of research caps the user found,
#           PSNProfiles' Iceborne trophy guide on Master Rank research, and the in-game research list on 2026-10-27
#           (green stars for Low Rank, 4 yellow for High Rank; 3 purple slots appear once the yellow ones are full,
#           e.g. Dodogama at 4). Kulve Taroth's 7 is from the community list only.


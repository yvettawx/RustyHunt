[package]
name = "rustyhunt-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Installer and uninstaller: installs into the current user's folder without admin rights"

[[bin]]
name = "rustyhunt-setup"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
]

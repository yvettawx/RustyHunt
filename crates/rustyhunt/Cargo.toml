[package]
name = "rustyhunt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-game overlay and desktop app for Monster Hunter"

[build-dependencies]
winresource = "0.1"

[dependencies]
address-map = { path = "../address-map" }
egui_software_backend = { path = "../egui-software-backend" }
game-world = { path = "../game-world" }
platform = { path = "../platform" }
plugin-host = { path = "../plugin-host" }
rustyhunt-core = { path = "../core" }
ui-kit = { path = "../ui-kit" }
bytemuck = "1"
chrono = "0.4"
egui = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
rfd = "0.15"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "0.4"
sha2 = "0.11"
toml = "1"
tray-icon = "0.26"
ureq = { version = "3", features = ["json"] }
winit = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
